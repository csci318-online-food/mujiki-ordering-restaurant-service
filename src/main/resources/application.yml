# Spring Configuration
spring:
  application:
    name: restaurant
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:mujiki_restaurant
    username: mujiki_restaurant
    password: nothing

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  liquibase:
    change-log: classpath:logs/db.changelog-master.xml
    enabled: true

  # Spring Cloud Stream - Kafka Configuration
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092  # Kafka broker location, can be a list for multiple brokers
      bindings:
        handleFeedbackEvent-in-0:
          destination: mujikiFeedbackEvent  # Topic for Mujiki Feedback Events
          content-type: application/json    # Content type for messages

# API Configuration
api:
  endpoint:
    base-url: /api


# Server Configuration
server:
  error:
    whitelabel:
      enabled: false
  port: 8082

# API Configuration
address:
  url:
    service: http://localhost:8086/api/address
